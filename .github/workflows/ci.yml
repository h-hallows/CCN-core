name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # ci, not install: this repository is the one two others pin by tag, so its own
      # build must resolve to exactly what the lockfile says.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The invariant suite lives here so it cannot be weakened in one consumer
      # without the other noticing. It runs against an in-memory Postgres with the
      # real migrations applied, so the triggers and constraints are exercised.
      - name: Tests, including the invariant gate
        run: npm test
